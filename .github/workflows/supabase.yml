# Deploys database migrations and the api Edge Function to a Supabase project (manifest E3, E9).
# Run by hand: Actions → Supabase → Run workflow. Staging first; production after the release is tested.
name: Supabase
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which project"
        type: choice
        options: [staging, production]
        required: true
permissions:
  contents: read
concurrency:
  group: supabase-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: supabase-${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Check configuration
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$PROJECT_REF" ] || {
            echo "::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD (secrets) and SUPABASE_PROJECT_REF (variable) on the supabase-${{ inputs.target }} environment. See docs/SETUP-SUPABASE.md."; exit 1; }
      - run: npx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Back up the database before changing it (E9)
        run: |
          mkdir -p backup
          npx supabase db dump --linked -f backup/schema.sql
          npx supabase db dump --linked --data-only -f backup/data.sql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "db-backup-${{ inputs.target }}-${{ github.run_id }}", path: backup, retention-days: 90 }
      - name: Apply migrations
        run: npx supabase db push --linked --include-all
      - name: Deploy the api function
        run: |
          python3 tools/prepare_functions.py
          npx supabase secrets set --project-ref "$PROJECT_REF" ALLOWED_ORIGINS="https://bentarne-jpg.github.io"
          npx supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt
